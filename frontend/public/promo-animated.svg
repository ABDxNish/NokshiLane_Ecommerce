<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="650"
  viewBox="0 0 900 650"
>
  <rect
    width="900"
    height="650"
    fill="#eef3df"
  />

  <rect
    x="45"
    y="45"
    width="810"
    height="560"
    rx="45"
    fill="none"
    stroke="#111512"
    stroke-width="3"
  />

  <circle
    cx="670"
    cy="115"
    r="180"
    fill="#b8ff44"
  >
    <animate
      attributeName="cx"
      values="620;735;620"
      dur="3.2s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="cy"
      values="105;145;105"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>

  <circle
    cx="45"
    cy="610"
    r="170"
    fill="#111512"
  >
    <animate
      attributeName="cx"
      values="25;120;25"
      dur="4.5s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="90"
    y="145"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700"
    fill="#111512"
  >
    NOKSHILANE / WEEKEND EDIT
  </text>

  <text
    x="90"
    y="275"
    font-family="Arial, Helvetica, sans-serif"
    font-size="74"
    font-weight="900"
    fill="#111512"
  >
    SELECTED
  </text>

  <text
    x="90"
    y="355"
    font-family="Arial, Helvetica, sans-serif"
    font-size="74"
    font-weight="900"
    fill="#111512"
  >
    MARKDOWNS
  </text>

  <text
    x="90"
    y="495"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="700"
    fill="#111512"
  >
    SHOP THE NEW DROP
  </text>
</svg>
